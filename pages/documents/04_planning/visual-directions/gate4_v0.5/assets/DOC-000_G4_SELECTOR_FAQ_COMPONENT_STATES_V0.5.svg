r, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >for QA and purchasing checks.</text><text x="704" y="1050" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >No button, count, badge or empty action slot.</text><text x="704" y="1074" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >No hover lift because the whole card is informational.</text><text x="704" y="1098" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Linear document icon uses Navy outline + Teal accent.</text><text x="48" y="1265" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#062B5B" text-anchor="start" >Focus and hover samples</text><rect x="48" y="1310" width="250" height="50" rx="7" fill="#007F77" stroke="#007F77" stroke-width="1" /><text x="173" y="1341" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Continue to Request Documents</text><rect x="346" y="1310" width="250" height="50" rx="7" fill="#006B65" stroke="#006B65" stroke-width="1" /><text x="471" y="1341" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Continue to Request Documents</text><rect x="642" y="1306" width="258" height="58" rx="9" fill="#FFFFFF" stroke="#007F77" stroke-width="3" /><rect x="646" y="1310" width="250" height="50" rx="7" fill="#007F77" stroke="#007F77" stroke-width="1" /><text x="771" y="1341" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Continue to Request Documents</text><text x="48" y="1390" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#526176" text-anchor="start" >DEFAULT</text><text x="346" y="1390" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#526176" text-anchor="start" >HOVER</text><text x="642" y="1390" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#526176" text-anchor="start" >KEYBOARD FOCUS</text><rect x="48" y="1475" width="1344" height="248" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="78" y="1521" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#062B5B" text-anchor="start" >State boundary</text><text x="78" y="1558" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >No selector state implies document availability, approval, downloadability, language coverage, regulatory scope or immediate supply.</text><text x="78" y="1583" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >The selected state means only that a grade can be carried into the editable Request Documents form.</text><text x="78" y="1608" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Unavailable routes or unverified inventory remain release constraints and do not become Buyer Clean labels.</text></svg>