<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2600" viewBox="0 0 1440 2600"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#062B5B" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1440" height="2600" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1440" height="2600" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1440" height="104" rx="0" fill="#031B3A" stroke="#031B3A" stroke-width="1" /><text x="56" y="42" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start" >CONV-RFQ · GATE 5 STATE PROOF</text><text x="56" y="78" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" >Complete interaction and restricted states</text><text x="56" y="148" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >01 · Editable prefill</text><text x="56" y="178" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Product / Grade *</text><rect x="56" y="192" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="71" y="225" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >M-2377</text><text x="334" y="225" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#526176" text-anchor="middle" >▾</text><text x="384" y="178" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Application *</text><rect x="384" y="192" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="399" y="225" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Coatings</text><text x="662" y="225" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#526176" text-anchor="middle" >▾</text><text x="56" y="280" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Destination Country *</text><rect x="56" y="294" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#007F77" stroke-width="2" filter="url(#shadow)"/><text x="71" y="327" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Brazil</text><text x="384" y="280" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Additional Requirements (optional)</text><rect x="384" y="294" width="300" height="104" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="399" y="327" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Sulfate</text><text x="736" y="148" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >02 · Validation, focus and error</text><rect x="736" y="178" width="648" height="104" rx="12" fill="#FFF1F0" stroke="#FDA29B" stroke-width="1" /><text x="758" y="216" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#B42318" text-anchor="start" >Please review the highlighted fields.</text><text x="758" y="248" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Correct the information below and try again.</text><text x="758" y="270" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Your other entries are still here.</text><text x="736" y="308" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Required Quantity *</text><rect x="736" y="322" width="648" height="52" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="2" /><text x="736" y="394" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B42318" text-anchor="start" >Enter a quantity greater than 0.</text><text x="56" y="578" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >03 · Submitting / duplicate prevention</text><rect x="56" y="608" width="648" height="188" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="78" y="646" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#062B5B" text-anchor="start" >Submitting your quotation request</text><text x="78" y="678" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Your entered information remains visible.</text><text x="78" y="700" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >The submit control is temporarily protected.</text><rect x="78" y="728" width="220" height="52" rx="7" fill="#062B5B" stroke="#062B5B" stroke-width="1" /><text x="188" y="761" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >SUBMITTING…</text><text x="736" y="578" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >04 · System failure / retry</text><rect x="736" y="608" width="648" height="188" rx="12" fill="#FFFAEB" stroke="#FEDF89" stroke-width="1" /><text x="758" y="646" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708" text-anchor="start" >Something went wrong while submitting your request.</text><text x="758" y="678" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Your information is still here. Please try again.</text><rect x="758" y="728" width="170" height="52" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1" /><text x="843" y="761" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#062B5B" text-anchor="middle" >TRY AGAIN</text><text x="56" y="898" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >05 · Receipt-only success</text><rect x="56" y="928" width="648" height="170" rx="12" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="1" /><text x="78" y="966" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#067647" text-anchor="start" >Thank you. We’ve received your quotation request.</text><text x="78" y="998" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Our team will review the details and contact you</text><text x="78" y="1020" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >using the information provided.</text><text x="736" y="898" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >06 · Form unavailable</text><rect x="736" y="928" width="648" height="170" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="758" y="966" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#062B5B" text-anchor="start" >The quotation request form is temporarily unavailable.</text><text x="758" y="998" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >No request has been submitted. Please return later</text><text x="758" y="1020" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >and try again.</text><text x="56" y="1188" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >07 · Long value and long-copy boundary</text><text x="56" y="1218" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Destination Country *</text><rect x="56" y="1232" width="632" height="52" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="2" /><text x="71" y="1265" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >A buyer-entered destination country name that exceeds the approved maximum length</text><text x="56" y="1304" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B42318" text-anchor="start" >Keep the destination country to 100 characters or fewer.</text><text x="56" y="1368" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Website (optional)</text><rect x="56" y="1382" width="632" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="71" y="1415" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >https://procurement.example.com/international-sourcing/titanium-dioxide/request-context</text><text x="736" y="1188" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >08 · Preserved optional fields</text><text x="736" y="1218" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Phone / WhatsApp (optional)</text><rect x="736" y="1232" width="632" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="751" y="1265" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >+60 12 345 6789</text><text x="736" y="1320" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Website (optional)</text><rect x="736" y="1334" width="632" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="751" y="1367" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >https://company.com</text><text x="56" y="1578" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >State contract checks</text><rect x="56" y="1614" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1630" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1630" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Initial state is the complete responsive Buyer Clean page; no premature errors.</text><rect x="56" y="1668" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1684" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1684" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Prefill remains visible and editable; M-2377 + Coatings + Sulfate is neutral context only.</text><rect x="56" y="1722" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1738" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1738" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Submitting prevents duplicate form submission without hiding shared RFQ navigation.</text><rect x="56" y="1776" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1792" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1792" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Failure retains values and offers Try Again; no Contact fallback.</text><rect x="56" y="1830" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1846" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1846" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Success confirms receipt for human review only; no quote or commercial approval.</text><rect x="56" y="1884" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1900" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1900" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Unavailable uses final-reader copy only; no internal blocker language.</text><rect x="56" y="1938" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1954" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1954" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start" >Long values wrap or error without clipping; Phone / WhatsApp and Website remain present.</text></svg>