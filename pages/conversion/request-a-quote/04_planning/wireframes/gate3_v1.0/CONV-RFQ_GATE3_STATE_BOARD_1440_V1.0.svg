<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2220" viewBox="0 0 1440 2220"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="80" y="74" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#202020" text-anchor="start">CONV-RFQ Gate 3 — Key State Structure Board</text><text x="80" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Grayscale structural proof. Buyer-visible copy is exact where shown; review annotations remain outside Buyer Clean panels.</text><rect x="80" y="170" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="80" y="170" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="98" y="199" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">01. Initial</text><text x="672" y="199" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">NO PREMATURE ERRORS</text><text x="102" y="242" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202020" text-anchor="start">Quotation request details</text><text x="102" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Product / Grade *</text><rect x="102" y="284" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="117" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Select a product or grade</text><text x="648" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="102" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="102" y="388" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="117" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Enter the destination country</text><rect x="102" y="502" width="190" height="52" rx="5" fill="#444444" stroke="#444444" stroke-width="2"/><text x="197" y="535" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REQUEST QUOTE</text><text x="102" y="587" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">Empty required fields are neutral on first load.</text><rect x="750" y="170" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="750" y="170" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="768" y="199" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">02. Prefill</text><text x="1342" y="199" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">VISIBLE + EDITABLE</text><text x="772" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Product / Grade *</text><rect x="772" y="256" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="787" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">M-2377</text><text x="1318" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="772" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Application *</text><rect x="772" y="364" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="787" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">Coatings</text><text x="1318" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="772" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="772" y="472" width="566" height="52" rx="5" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="787" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">Brazil</text><text x="772" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">Independent request context; no suitability inference.</text><rect x="80" y="660" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="80" y="660" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="98" y="689" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">03. Field errors + summary</text><text x="672" y="689" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">FOCUS TARGET</text><rect x="102" y="732" width="566" height="86" rx="5" fill="#e5e5e5" stroke="#111111" stroke-width="3"/><text x="116" y="759" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202020" text-anchor="start">Please review the highlighted fields.</text><text x="116" y="783" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Correct the information below and try again. Your other entries are</text><text x="116" y="800" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">still here.</text><text x="102" y="844" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Required Quantity *</text><rect x="102" y="858" width="566" height="52" rx="5" fill="#ffffff" stroke="#444444" stroke-width="2"/><text x="102" y="930" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#444444" text-anchor="start">Enter a quantity greater than 0.</text><text x="102" y="972" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="102" y="986" width="566" height="52" rx="5" fill="#ffffff" stroke="#444444" stroke-width="2"/><text x="102" y="1058" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#444444" text-anchor="start">Enter a destination country.</text><rect x="750" y="660" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="750" y="660" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="768" y="689" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">04. Submitting</text><text x="1342" y="689" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">DUPLICATE BLOCKED</text><text x="772" y="732" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Entered information remains visible.</text><text x="772" y="764" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Business Email *</text><rect x="772" y="778" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="787" y="810" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">buyer@company.com</text><rect x="772" y="887" width="220" height="52" rx="5" fill="#444444" stroke="#444444" stroke-width="2"/><text x="882" y="920" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SUBMITTING…</text><rect x="772" y="887" width="220" height="52" rx="5" fill="none" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="6 4"/><text x="772" y="990" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">Only the form submit is temporarily protected.</text><text x="772" y="1019" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Shared RFQ navigation remains visible.</text><rect x="80" y="1150" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="80" y="1150" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="98" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">05. Submission failure</text><text x="672" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">VALUES RETAINED</text><rect x="102" y="1222" width="566" height="166" rx="5" fill="#e5e5e5" stroke="#111111" stroke-width="3"/><text x="118" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202020" text-anchor="start">Something went wrong while submitting your request.</text><text x="118" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Your information is still here. Please try again.</text><rect x="118" y="1318" width="150" height="52" rx="5" fill="#ffffff" stroke="#444444" stroke-width="2"/><text x="193" y="1351" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#444444" text-anchor="middle">TRY AGAIN</text><text x="102" y="1444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">No Contact fallback, email, phone or implied receipt.</text><rect x="750" y="1150" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="750" y="1150" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="768" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">06. Success</text><text x="1342" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">RECEIPT ONLY</text><rect x="772" y="1222" width="566" height="166" rx="5" fill="#e5e5e5" stroke="#444444" stroke-width="2"/><text x="788" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">Thank you. We’ve received your quotation request.</text><text x="788" y="1294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Our team will review the details and contact you using the</text><text x="788" y="1313" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">information provided.</text><text x="772" y="1446" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">No price, stock, MOQ, lead time, shipping, sample, document or order</text><text x="772" y="1464" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">approval.</text><rect x="80" y="1640" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="80" y="1640" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="98" y="1669" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">07. Route / form unavailable</text><text x="672" y="1669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">REVIEW PROOF</text><rect x="102" y="1712" width="566" height="160" rx="5" fill="#e5e5e5" stroke="#444444" stroke-width="2"/><text x="118" y="1750" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202020" text-anchor="start">The quotation request form is temporarily unavailable.</text><text x="118" y="1788" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">No request has been submitted. Please return later and try again.</text><text x="102" y="1934" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">Review annotation: RELEASE_BLOCKER; not approved for release.</text><text x="102" y="1963" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Shared Header/Footer RFQ entry remains visible.</text><rect x="750" y="1640" width="610" height="430" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="750" y="1640" width="610" height="46" rx="8" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="768" y="1669" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="start">08. Long value boundary</text><text x="1342" y="1669" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="end">TEXT INPUT</text><text x="772" y="1712" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="772" y="1726" width="566" height="52" rx="5" fill="#ffffff" stroke="#444444" stroke-width="2"/><text x="787" y="1758" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">A buyer-entered destination country name that exceeds the approved maximum length for this field</text><text x="772" y="1798" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#444444" text-anchor="start">Keep the destination country to 100 characters or fewer.</text><text x="772" y="1862" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Phone / WhatsApp (optional)</text><rect x="772" y="1876" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="772" y="1970" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Website (optional)</text><rect x="772" y="1984" width="566" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="787" y="2016" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">https://company.example/long-business-path</text></svg>