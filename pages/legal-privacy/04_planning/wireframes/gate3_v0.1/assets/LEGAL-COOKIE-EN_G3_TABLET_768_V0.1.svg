<svg xmlns="http://www.w3.org/2000/svg" width="768" height="3832" viewBox="0 0 768 3832"><rect width="100%" height="100%" fill="#f2f3f4"/><rect x="48" y="156" width="672" height="398" rx="7" fill="#ffffff" stroke="#a7a7a7"/><rect x="0" y="0" width="768" height="64" fill="#ffffff" stroke="#a7a7a7"/><rect x="18" y="13" width="118" height="38" rx="4" fill="#e4e6e8" stroke="#a7a7a7"/><text x="77" y="38" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#666666" text-anchor="middle" >TiO2 Malaysia</text><rect x="592" y="10" width="96" height="44" rx="5" fill="#3f4347"/><text x="640" y="38" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >RFQ</text><rect x="700" y="10" width="50" height="44" rx="5" fill="#ffffff" stroke="#3f4347"/><text x="725" y="38" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#222222" text-anchor="middle" >Menu</text><text x="48" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start" >Home  /  Cookie Policy</text><text x="84" y="230" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#222222" text-anchor="start" >Cookie Policy</text><text x="84" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#666666" text-anchor="start" >Last updated: 2 September 2026</text><text x="84" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >This Cookie Policy explains how TiO2 Malaysia uses Cookies and similar</text><text x="84" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >technologies, which technologies are active, and how you can manage available</text><text x="84" y="357" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >preferences.</text><text x="84" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >For information about our broader handling of personal data, read our Privacy</text><text x="84" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Policy.</text><rect x="84" y="448" width="240" height="48" rx="5" fill="#3f4347" stroke="#3f4347" stroke-width="0"/><text x="204" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >MANAGE COOKIE SETTINGS</text><rect x="340" y="448" width="240" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="460" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >READ OUR PRIVACY POLICY</text><rect x="48" y="602" width="672" height="96" rx="6" fill="#ffffff" stroke="#a7a7a7"/><text x="68" y="636" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start" >ON THIS PAGE</text><text x="68" y="667" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#222222" text-anchor="start" >7 sections</text><text x="692" y="653" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#222222" text-anchor="middle" >⌄</text><line x1="48" y1="734" x2="720" y2="734" stroke="#a7a7a7"/><text x="48" y="780" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Cookies and Similar Technologies</text><text x="48" y="828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Cookies are small text records that a website may ask a browser to store. Websites can</text><text x="48" y="849" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >also use other browser technologies, including Local Storage, to retain limited</text><text x="48" y="870" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >information between pages or visits.</text><text x="48" y="905" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >TiO2 Malaysia uses the term “Cookies and similar technologies” to cover these</text><text x="48" y="926" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >mechanisms collectively. An item in Local Storage is not technically a Cookie, and our</text><text x="48" y="947" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >inventory identifies the relevant type.</text><line x1="48" y1="1020" x2="720" y2="1020" stroke="#a7a7a7"/><text x="48" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Categories We Use</text><text x="48" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" >Necessary</text><text x="48" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Necessary technologies support functions such as site delivery, security and</text><text x="48" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >remembering a privacy choice. They are not used to grant optional Analytics,</text><text x="48" y="1201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >advertising storage or advertising personalisation.</text><text x="48" y="1248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" >Analytics</text><text x="48" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Analytics technologies help a website understand aggregate use. No optional Analytics</text><text x="48" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >technology is active in the currently verified TiO2 Malaysia configuration. Google</text><text x="48" y="1323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Analytics, Google Tag Manager and Vercel Web Analytics are not treated as active simply</text><text x="48" y="1344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >because they are planned or supported by the architecture.</text><text x="48" y="1391" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" >Advertising and personalisation</text><text x="48" y="1424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >No advertising or advertising-personalisation category is active in the currently</text><text x="48" y="1445" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >verified configuration. Google Ads is not enabled. Advertising storage, advertising</text><text x="48" y="1466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >user data and advertising personalisation remain denied under the approved consent</text><text x="48" y="1487" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >direction.</text><line x1="48" y1="1560" x2="720" y2="1560" stroke="#a7a7a7"/><text x="48" y="1606" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Current Cookie and Storage Inventory</text><text x="48" y="1654" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >The currently approved consent implementation may create the following first-party</text><text x="48" y="1675" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >storage record after the preference interface is introduced:</text><rect x="48" y="1710" width="672" height="41" fill="#e4e6e8" stroke="#a7a7a7"/><text x="60" y="1732" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="start" >Name • Provider • Type • Purpose • Duration • Category</text><rect x="48" y="1751" width="672" height="75" fill="#ffffff" stroke="#a7a7a7"/><text x="60" y="1773" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#222222" text-anchor="start" >tio2_my_consent_v1 • TiO2 Malaysia • Local Storage • Remembers the applicable privacy preference</text><text x="60" y="1790" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#222222" text-anchor="start" >and consent-text version for this site only • Until browser storage is cleared or the consent</text><text x="60" y="1807" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#222222" text-anchor="start" >version is replaced • Necessary</text><text x="48" y="1844" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >At the date shown above, no optional Analytics or advertising Cookie is active. If the</text><text x="48" y="1865" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >technologies used by this site change, we will update this inventory and the date at</text><text x="48" y="1886" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >the top of this policy.</text><line x1="48" y1="1959" x2="720" y2="1959" stroke="#a7a7a7"/><text x="48" y="2005" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >How Advanced Consent Mode Works</text><text x="48" y="2053" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Google Advanced Consent Mode is an approved implementation direction but Google</text><text x="48" y="2074" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >measurement is not currently active. No Google measurement transmission should be</text><text x="48" y="2095" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >inferred from this direction alone.</text><text x="48" y="2130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >If Google measurement is enabled later, we will update this policy and the consent</text><text x="48" y="2151" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >interface before activation. The implementation will set analytics_storage, ad_storage,</text><text x="48" y="2172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >ad_user_data and ad_personalization to denied before measurement commands. The updated</text><text x="48" y="2193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >disclosure will explain that consent-aware Google tags may send limited cookieless</text><text x="48" y="2214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >signals while storage is denied.</text><text x="48" y="2249" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Advertising personalisation will not be granted under the currently approved</text><text x="48" y="2270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >configuration.</text><line x1="48" y1="2343" x2="720" y2="2343" stroke="#a7a7a7"/><text x="48" y="2389" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Manage or Withdraw Your Choice</text><text x="48" y="2437" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Use Cookie Settings in the Footer to review the current status. While no optional</text><text x="48" y="2458" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Analytics technology is active, the interface will not ask you to accept a non-existent</text><text x="48" y="2479" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Analytics service.</text><text x="48" y="2514" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >If optional Analytics is introduced later, it will be off by default. You will be able</text><text x="48" y="2535" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >to choose Accept analytics or Necessary only, and you will be able to withdraw an</text><text x="48" y="2556" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Analytics choice through the same Footer control. Withdrawing a choice will update the</text><text x="48" y="2577" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >applicable consent state for future activity; it does not undo processing that was</text><text x="48" y="2598" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >lawful before withdrawal.</text><line x1="48" y1="2671" x2="720" y2="2671" stroke="#a7a7a7"/><text x="48" y="2717" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Browser Controls</text><text x="48" y="2765" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Most browsers allow you to view, delete or block Cookies and site data. Blocking all</text><text x="48" y="2786" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >browser storage may prevent a preference from being remembered and may affect functions</text><text x="48" y="2807" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >that genuinely require storage. Clearing site data may cause the preference interface</text><text x="48" y="2828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >to appear again.</text><text x="48" y="2863" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >Browser settings operate separately from the controls provided by TiO2 Malaysia. Refer</text><text x="48" y="2884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >to your browser’s help information for instructions specific to your browser and</text><text x="48" y="2905" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >device.</text><line x1="48" y1="2978" x2="720" y2="2978" stroke="#a7a7a7"/><text x="48" y="3024" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#222222" text-anchor="start" >Changes and Contact</text><text x="48" y="3072" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >We update this Cookie Policy when the active technology, purpose, provider or duration</text><text x="48" y="3093" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >changes. The date at the top identifies the latest version.</text><text x="48" y="3128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >For questions about Cookies, browser storage or privacy choices, email</text><text x="48" y="3149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >info@tio2malaysia.com.</text><rect x="48" y="3184" width="240" height="48" rx="5" fill="#3f4347" stroke="#3f4347" stroke-width="0"/><text x="168" y="3214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >MANAGE COOKIE SETTINGS</text><rect x="304" y="3184" width="240" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="424" y="3214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >READ OUR PRIVACY POLICY</text><rect x="0" y="3332" width="768" height="500" fill="#3f4347"/><text x="48" y="3390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >BRAND / TIO2 MALAYSIA</text><text x="48" y="3420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >A focused titanium dioxide purchasing</text><text x="48" y="3439" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >platform for international industrial</text><text x="48" y="3458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >buyers.</text><text x="420" y="3390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" >PROCUREMENT</text><rect x="420" y="3408" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="530" y="3438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Request a Quote</text><text x="48" y="3522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" >EXPLORE</text><text x="420" y="3522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" >INFORMATION</text><text x="48" y="3554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Home · Markets · Products · Applications</text><text x="420" y="3554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Documents · Resources · About</text><line x1="48" y1="3662" x2="720" y2="3662" stroke="#777"/><text x="48" y="3707" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start" >© 2026 TiO2 Malaysia. | Privacy Policy | Dasar Privasi (BM) | Cookie Policy | Cookie Settings</text></svg>