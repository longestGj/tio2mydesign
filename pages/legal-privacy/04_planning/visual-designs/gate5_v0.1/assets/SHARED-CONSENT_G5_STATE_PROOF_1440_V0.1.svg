<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2200" viewBox="0 0 1440 2200"><rect x="0" y="0" width="1440" height="2200" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/><text x="70" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="32" font-weight="750" fill="#062B5B" text-anchor="start">Cookie Settings — Gate 5 Interaction State Proof</text><text x="70" y="106" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Annotations identify mutually exclusive states; annotation text is not part of the public interface.</text><text x="70" y="152" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="750" fill="#64748B" text-anchor="start">STATE A · CURRENT RELEASE / NO OPTIONAL ANALYTICS</text><rect x="70" y="170" width="620" height="300" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="98" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#062B5B" text-anchor="start">Cookie settings</text><text x="98" y="266" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">No optional Analytics or advertising technology is currently active on</text><text x="98" y="290" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">this site. Necessary functions may use browser storage to operate the</text><text x="98" y="314" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">site and remember an available privacy setting.</text><rect x="98" y="392" width="170" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="183" y="422" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">CLOSE</text><rect x="284" y="392" width="220" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="394" y="422" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">READ COOKIE POLICY</text><text x="750" y="152" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="750" fill="#64748B" text-anchor="start">STATE B · CONDITIONAL / VERIFIED ANALYTICS ACTIVE</text><rect x="750" y="170" width="620" height="350" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="778" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#062B5B" text-anchor="start">Analytics preferences</text><text x="778" y="266" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Optional analytics helps us understand how this website is used.</text><text x="778" y="290" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Necessary only keeps optional storage off, but limited cookieless</text><text x="778" y="314" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">measurement signals may still be sent to Google.</text><rect x="778" y="442" width="200" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="878" y="472" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">ACCEPT ANALYTICS</text><rect x="994" y="442" width="190" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="1089" y="472" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">NECESSARY ONLY</text><text x="1200" y="474" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="650" fill="#008078" text-anchor="start">COOKIE POLICY →</text><text x="70" y="562" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="750" fill="#64748B" text-anchor="start">STATE C · REOPENED SETTINGS / EXISTING CHOICE</text><rect x="70" y="580" width="1300" height="420" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="98" y="638" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#062B5B" text-anchor="start">Cookie settings</text><text x="98" y="676" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Review or change the current Analytics preference. Closing without saving preserves the existing choice.</text><rect x="98" y="718" width="1244" height="72" rx="9" fill="#F5F8FB" stroke="#D9E2EC" stroke-width="1"/><text x="116" y="746" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#008078" text-anchor="start">NECESSARY · ALWAYS ACTIVE</text><text x="116" y="770" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Site operation, security and remembering this site’s privacy choice.</text><rect x="98" y="804" width="1244" height="72" rx="9" fill="#F5F8FB" stroke="#D9E2EC" stroke-width="1"/><text x="116" y="832" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#008078" text-anchor="start">ANALYTICS · OFF BY DEFAULT</text><text x="116" y="856" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Aggregate Google Analytics measurement only after acceptance.</text><rect x="98" y="922" width="210" height="48" rx="7" fill="#008078" stroke="#008078" stroke-width="1"/><text x="203" y="952" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SAVE PREFERENCES</text><rect x="324" y="922" width="200" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="424" y="952" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">ACCEPT ANALYTICS</text><rect x="540" y="922" width="190" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="635" y="952" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">NECESSARY ONLY</text><rect x="746" y="922" width="140" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1.5"/><text x="816" y="952" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#062B5B" text-anchor="middle">CLOSE</text><text x="70" y="1070" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#64748B" text-anchor="start">CONSENT SIGNAL MATRIX</text><rect x="70" y="1100" width="1300" height="54" rx="8" fill="#062B5B" stroke="none" stroke-width="1"/><text x="84" y="1134" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">STATE</text><text x="344" y="1134" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">ANALYTICS STORAGE</text><text x="604" y="1134" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">AD STORAGE</text><text x="864" y="1134" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">AD USER DATA</text><text x="1124" y="1134" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">PERSONALIZATION</text><rect x="70" y="1154" width="1300" height="60" rx="0" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="84" y="1191" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#334155" text-anchor="start">Before choice</text><text x="344" y="1191" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="604" y="1191" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="864" y="1191" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="1124" y="1191" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><rect x="70" y="1214" width="1300" height="60" rx="0" fill="#F5F8FB" stroke="#D9E2EC" stroke-width="1"/><text x="84" y="1251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#334155" text-anchor="start">Necessary only</text><text x="344" y="1251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="604" y="1251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="864" y="1251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><text x="1124" y="1251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start">denied</text><rect x="70" y="1274" width="1300" height="60" rx="0" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="84" y="1311" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#334155" text-anchor="start">Accept analytics</text><text x="344" y="1311" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#008078" text-anchor=