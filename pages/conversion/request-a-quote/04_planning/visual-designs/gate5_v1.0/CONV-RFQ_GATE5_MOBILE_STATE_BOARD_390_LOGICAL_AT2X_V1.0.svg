<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2100" viewBox="0 0 390 2100"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#062B5B" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="390" height="2100" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1" /><rect x="0" y="0" width="390" height="2100" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1" /><rect x="0" y="0" width="390" height="96" rx="0" fill="#031B3A" stroke="#031B3A" stroke-width="1" /><text x="20" y="36" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="start" >CONV-RFQ · GATE 5</text><text x="20" y="70" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start" >390px state proof</text><text x="24" y="130" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#062B5B" text-anchor="start" >Validation / focus / error</text><text x="24" y="160" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Destination Country *</text><rect x="24" y="174" width="342" height="52" rx="7" fill="#FFFFFF" stroke="#007F77" stroke-width="2" filter="url(#shadow)"/><text x="39" y="207" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Brazil</text><text x="24" y="275" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Required Quantity *</text><rect x="24" y="289" width="342" height="52" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="2" /><text x="24" y="361" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B42318" text-anchor="start" >Enter a quantity greater than 0.</text><rect x="24" y="440" width="342" height="190" rx="12" fill="#FFFAEB" stroke="#FEDF89" stroke-width="1" /><text x="46" y="478" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708" text-anchor="start" >Something went wrong while</text><text x="46" y="499" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708" text-anchor="start" >submitting your request.</text><text x="46" y="531" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Your information is still here.</text><text x="46" y="553" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Please try again.</text><rect x="46" y="564" width="150" height="52" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-width="1" /><text x="121" y="597" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#062B5B" text-anchor="middle" >TRY AGAIN</text><rect x="24" y="678" width="342" height="208" rx="12" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="1" /><text x="46" y="716" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#067647" text-anchor="start" >Thank you. We’ve received your</text><text x="46" y="737" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#067647" text-anchor="start" >quotation request.</text><text x="46" y="769" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Our team will review the details and</text><text x="46" y="791" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >contact you using the information provided.</text><rect x="24" y="936" width="342" height="208" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="46" y="974" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#062B5B" text-anchor="start" >The quotation request form is</text><text x="46" y="995" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#062B5B" text-anchor="start" >temporarily unavailable.</text><text x="46" y="1027" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >No request has been submitted.</text><text x="46" y="1049" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Please return later and try again.</text><text x="24" y="1204" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#062B5B" text-anchor="start" >Long value boundary</text><text x="24" y="1234" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Destination Country *</text><rect x="24" y="1248" width="342" height="52" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="2" /><text x="39" y="1281" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >A buyer-entered destination country name…</text><text x="24" y="1320" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B42318" text-anchor="start" >Keep the destination country to 100 characters</text><text x="24" y="1337" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B42318" text-anchor="start" >or fewer.</text><text x="24" y="1434" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="start" >No horizontal overflow at 390px logical.</text><text x="24" y="1464" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="start" >All controls and links remain at least 44px high.</text></svg>