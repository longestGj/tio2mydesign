<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900"><rect width="100%" height="100%" fill="#f2f3f4"/><text x="72" y="70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#222222" text-anchor="start" >Cookie Settings / Advanced Consent — Gate 3 State Board</text><text x="72" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start" >Shared component · buyer-visible copy · mutually exclusive release states</text><text x="72" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start" >A. NO OPTIONAL ANALYTICS ACTIVE</text><rect x="72" y="175" width="1296" height="270" rx="8" fill="#ffffff" stroke="#a7a7a7"/><text x="112" y="230" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222" text-anchor="start" >NO OPTIONAL ANALYTICS ACTIVE</text><text x="112" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >No optional Analytics or advertising technology is currently active on this site. Necessary functions may use browser storage to operate the</text><text x="112" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >site and remember an available privacy setting.</text><rect x="112" y="375" width="220" height="48" rx="5" fill="#3f4347" stroke="#3f4347" stroke-width="0"/><text x="222" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >Close</text><rect x="348" y="375" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="458" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Read Cookie Policy</text><text x="72" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start" >B. ANALYTICS ACTIVE — FIRST LAYER</text><rect x="72" y="505" width="1296" height="270" rx="8" fill="#ffffff" stroke="#a7a7a7"/><text x="112" y="560" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222" text-anchor="start" >ANALYTICS ACTIVE — FIRST LAYER</text><text x="112" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >Optional analytics helps us understand how this website is used. If you choose Necessary only, optional storage remains off, but limited</text><text x="112" y="622" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >cookieless measurement signals may still be sent to Google.</text><rect x="112" y="705" width="220" height="48" rx="5" fill="#3f4347" stroke="#3f4347" stroke-width="0"/><text x="222" y="735" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >Accept analytics</text><rect x="348" y="705" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="458" y="735" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Necessary only</text><rect x="584" y="705" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="694" y="735" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Cookie Policy</text><text x="72" y="850" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start" >C. REOPENED SETTINGS</text><rect x="72" y="875" width="1296" height="270" rx="8" fill="#ffffff" stroke="#a7a7a7"/><text x="112" y="930" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#222222" text-anchor="start" >REOPENED SETTINGS</text><text x="112" y="970" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >Necessary — Always active. Supports site operation, security and remembering this site’s privacy choice.</text><text x="112" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >Analytics — Off by default. Allows aggregate Google Analytics measurement after you accept it. Advertising storage and personalisation remain</text><text x="112" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="start" >off.</text><rect x="112" y="1075" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="222" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Save preferences</text><rect x="348" y="1075" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="458" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Accept analytics</text><rect x="584" y="1075" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="694" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Necessary only</text><rect x="820" y="1075" width="220" height="48" rx="5" fill="#ffffff" stroke="#3f4347" stroke-width="1.5"/><text x="930" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="middle" >Close</text><text x="72" y="1235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start" >D. SIGNAL MATRIX</text><rect x="72" y="1265" width="1296" height="58" fill="#e4e6e8" stroke="#a7a7a7"/><text x="92" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" >State</text><text x="344" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" >analytics_storage</text><text x="596" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" >ad_storage</text><text x="848" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" >ad_user_data</text><text x="1100" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" >ad_personalization</text><rect x="72" y="1323" width="1296" height="58" fill="#ffffff" stroke="#a7a7a7"/><text x="92" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >Before choice</text><text x="344" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="596" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="848" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="1100" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><rect x="72" y="1381" width="1296" height="58" fill="#ffffff" stroke="#a7a7a7"/><text x="92" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >Necessary only</text><text x="344" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="596" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="848" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="1100" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><rect x="72" y="1439" width="1296" height="58" fill="#ffffff" stroke="#a7a7a7"/><text x="92" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >Accept analytics</text><text x="344" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >granted</text><text x="596" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="848" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="1100" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><rect x="72" y="1497" width="1296" height="58" fill="#ffffff" stroke="#a7a7a7"/><text x="92" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >Withdrawal</text><text x="344" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="596" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="848" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="1100" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start" >denied</text><text x="72" y="1605" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start" >E. FAILURE / ACCESSIBILITY CONTRACT</text><text x="92" y="1650" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >• Runtime error: optional tags remain denied; page and RFQ remain usable.</text><text x="92" y="1698" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >• Local Storage blocked: apply the current-session choice where possible; do not claim persistence.</text><text x="92" y="1746" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >• Accept and Necessary only use comparable size and effort; minimum target 44px.</text><text x="92" y="1794" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start" >• Initial focus, Escape/close and focus return to the Footer Cookie Settings button are required.</text></svg>