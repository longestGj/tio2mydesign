<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2720" viewBox="0 0 1440 2720"><rect width="100%" height="100%" fill="#f4f4f4"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="56" y="22" width="170" height="40" rx="4" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="141" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="middle">SHARED LOGO</text><text x="300" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Home</text><text x="400" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Markets</text><text x="500" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Products</text><text x="600" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Applications</text><text x="700" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Documents</text><text x="800" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">Resources</text><text x="900" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020" text-anchor="start">About</text><rect x="1234" y="18" width="150" height="48" rx="5" fill="#444444" stroke="#444444" stroke-width="1"/><text x="1309" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Request a Quote</text><text x="720" y="77" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="middle">Shared Header V0.5 — consumed unchanged</text><text x="190" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#666666" text-anchor="start">Home  /  Request a Quote</text><text x="190" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">B2B QUOTATION REQUEST</text><text x="190" y="252" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#202020" text-anchor="start">Request a Titanium Dioxide Quote</text><text x="190" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#666666" text-anchor="start">Tell us the product, application, quantity and destination you are evaluating. Our team will review your</text><text x="190" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#666666" text-anchor="start">requirements and prepare the appropriate commercial response.</text><line x1="190" y1="362" x2="1250" y2="362" stroke="#a8a8a8" stroke-width="1"/><rect x="190" y="405" width="1060" height="1630" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="465" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202020" text-anchor="start">Quotation request details</text><text x="246" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Required fields are marked. Please use business information and avoid confidential formulations, account</text><text x="246" y="521" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">credentials, payment details or sensitive personal information.</text><text x="246" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">YOUR REQUIREMENT</text><line x1="246" y1="582" x2="1194" y2="582" stroke="#e5e5e5" stroke-width="2"/><text x="246" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Product / Grade *</text><rect x="246" y="624" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="261" y="656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Select a product or grade</text><text x="685" y="656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="735" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Application *</text><rect x="735" y="624" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="750" y="656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Select an application</text><text x="1174" y="656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="246" y="725" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Required Quantity *</text><rect x="246" y="739" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="261" y="771" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Enter quantity</text><rect x="535" y="739" width="170" height="52" rx="0" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="620" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#444444" text-anchor="middle">Metric tonnes (MT)</text><text x="735" y="725" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="735" y="739" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="750" y="771" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Enter the destination country</text><text x="246" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Port / City (optional)</text><rect x="246" y="854" width="948" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="926" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Add this only if it is already known.</text><text x="246" y="985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">COMPANY DETAILS</text><line x1="246" y1="997" x2="1194" y2="997" stroke="#e5e5e5" stroke-width="2"/><text x="246" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Company Name *</text><rect x="246" y="1039" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="735" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Your Name *</text><rect x="735" y="1039" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Business Email *</text><rect x="246" y="1154" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="261" y="1186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">name@company.com</text><text x="246" y="1226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Use the business email where we can respond to this</text><text x="246" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">request.</text><text x="735" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Phone / WhatsApp (optional)</text><rect x="735" y="1154" width="459" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="1285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Website (optional)</text><rect x="246" y="1299" width="948" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="261" y="1331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">https://company.com</text><text x="246" y="1430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">ADDITIONAL REQUIREMENTS</text><line x1="246" y1="1442" x2="1194" y2="1442" stroke="#e5e5e5" stroke-width="2"/><text x="246" y="1470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Additional Requirements (optional)</text><rect x="246" y="1484" width="948" height="94" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="1598" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Add any non-confidential specification, packaging, schedule, document or other context that may help us review the</text><text x="246" y="1614" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">request.</text><text x="246" y="1675" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">We use the information you provide to review and respond to your quotation request. Learn more in our Privacy</text><text x="246" y="1694" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Policy.</text><line x1="962" y1="1693" x2="1046" y2="1693" stroke="#444444" stroke-width="1"/><rect x="246" y="1740" width="220" height="52" rx="5" fill="#444444" stroke="#444444" stroke-width="2"/><text x="356" y="1773" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REQUEST QUOTE</text><text x="246" y="1828" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">Desktop rule: one vertical page flow; two columns exist only inside this form.</text><rect x="190" y="2090" width="1060" height="250" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="246" y="2150" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202020" text-anchor="start">Other request types</text><text x="246" y="2185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Use the separate request form when you need a sample review or controlled document request instead of a</text><text x="246" y="2206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">quotation.</text><text x="246" y="2255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#444444" text-anchor="start">Request a Sample  →</text><text x="460" y="2255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#444444" text-anchor="start">Request Documents  →</text><rect x="0" y="2420" width="1440" height="300" rx="0" fill="#444444" stroke="#444444" stroke-width="1"/><rect x="115.2" y="2472" width="288" height="44" rx="4" fill="#666666" stroke="#a8a8a8" stroke-width="1"/><text x="720" y="2570" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">APPROVED SHARED FOOTER — CONSUMED UNCHANGED</text><text x="720" y="2598" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#e5e5e5" text-anchor="middle">Owned by Home / Global Chrome</text></svg>