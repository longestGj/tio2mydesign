<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2679" viewBox="0 0 390 2679"><rect width="100%" height="100%" fill="#f4f4f4"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><rect x="20" y="18" width="122" height="28" rx="4" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="81" y="38" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="middle">SHARED LOGO</text><rect x="264" y="10" width="78" height="44" rx="4" fill="#444444" stroke="#444444" stroke-width="1"/><text x="303" y="37" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RFQ</text><rect x="350" y="15" width="24" height="30" rx="0" fill="#ffffff" stroke="#a8a8a8" stroke-width="0"/><line x1="352" y1="22" x2="372" y2="22" stroke="#444444" stroke-width="2"/><line x1="352" y1="30" x2="372" y2="30" stroke="#444444" stroke-width="2"/><line x1="352" y1="38" x2="372" y2="38" stroke="#444444" stroke-width="2"/><text x="195" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="middle">Shared Header V0.5 — consumed unchanged</text><text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#666666" text-anchor="start">Home  /  Request a Quote</text><text x="24" y="157" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#666666" text-anchor="start">B2B QUOTATION REQUEST</text><text x="24" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202020" text-anchor="start">Request a Titanium Dioxide</text><text x="24" y="226" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202020" text-anchor="start">Quote</text><text x="24" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Tell us the product, application, quantity</text><text x="24" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">and destination you are evaluating. Our</text><text x="24" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">team will review your requirements and</text><text x="24" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">prepare the appropriate commercial</text><text x="24" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">response.</text><rect x="24" y="382" width="342" height="1699" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="434" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#202020" text-anchor="start">Quotation request details</text><text x="42" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Required fields are marked. Please use</text><text x="42" y="486" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">business information and avoid</text><text x="42" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">confidential formulations, account</text><text x="42" y="522" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">credentials, payment details or</text><text x="42" y="540" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">sensitive personal information.</text><text x="42" y="593" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">YOUR REQUIREMENT</text><line x1="42" y1="605" x2="348" y2="605" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Product / Grade *</text><rect x="42" y="651" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="683" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Select a product or grade</text><text x="328" y="683" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="42" y="721" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Application *</text><rect x="42" y="735" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="767" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Select an application</text><text x="328" y="767" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="middle">▾</text><text x="42" y="805" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Required Quantity *</text><rect x="42" y="819" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="851" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Enter quantity</text><rect x="219.48000000000002" y="819" width="128.51999999999998" height="52" rx="0" fill="#e5e5e5" stroke="#a8a8a8" stroke-width="1"/><text x="283.74" y="851" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#444444" text-anchor="middle">Metric tonnes (MT)</text><text x="42" y="889" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Country *</text><rect x="42" y="903" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="935" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Enter the destination country</text><text x="42" y="973" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Destination Port / City (optional)</text><rect x="42" y="987" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="1059" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Add this only if it is already known.</text><text x="42" y="1102" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">COMPANY DETAILS</text><line x1="42" y1="1114" x2="348" y2="1114" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="1147" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Company Name *</text><rect x="42" y="1161" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="1231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Your Name *</text><rect x="42" y="1245" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Business Email *</text><rect x="42" y="1329" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="1361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">name@company.com</text><text x="42" y="1401" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Use the business email where we can</text><text x="42" y="1417" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">respond to this request.</text><text x="42" y="1455" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Phone / WhatsApp (optional)</text><rect x="42" y="1469" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="1539" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Website (optional)</text><rect x="42" y="1553" width="306" height="52" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="57" y="1585" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020" text-anchor="start">https://company.com</text><text x="42" y="1628" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#666666" text-anchor="start">ADDITIONAL REQUIREMENTS</text><line x1="42" y1="1640" x2="348" y2="1640" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="1673" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202020" text-anchor="start">Additional Requirements (optional)</text><rect x="42" y="1687" width="306" height="94" rx="5" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="1801" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Add any non-confidential</text><text x="42" y="1817" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">specification, packaging, schedule,</text><text x="42" y="1833" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">document or other context that may</text><text x="42" y="1849" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">help us review the request.</text><text x="42" y="1895" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">We use the information you provide to</text><text x="42" y="1913" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">review and respond to your quotation</text><text x="42" y="1931" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">request. Learn more in our </text><text x="206" y="1931" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-decoration="underline">Privacy Policy.</text><rect x="42" y="1981" width="306" height="52" rx="5" fill="#444444" stroke="#444444" stroke-width="2"/><text x="195" y="2014" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REQUEST QUOTE</text><rect x="24" y="2129" width="342" height="250" rx="8" fill="#ffffff" stroke="#a8a8a8" stroke-width="1"/><text x="42" y="2179" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202020" text-anchor="start">Other request types</text><text x="42" y="2211" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Use the separate request form when you</text><text x="42" y="2229" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">need a sample review or controlled</text><text x="42" y="2247" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">document request instead of a</text><text x="42" y="2265" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="start">quotation.</text><text x="42" y="2307" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#444444" text-anchor="start">Request a Sample  →</text><text x="42" y="2343" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#444444" text-anchor="start">Request Documents  →</text><rect x="0" y="2459" width="390" height="220" rx="0" fill="#444444" stroke="#444444" stroke-width="1"/><rect x="31.2" y="2511" width="78" height="44" rx="4" fill="#666666" stroke="#a8a8a8" stroke-width="1"/><text x="195" y="2559" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">APPROVED SHARED FOOTER</text><text x="195" y="2581" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CONSUMED UNCHANGED</text><text x="195" y="2607" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#e5e5e5" text-anchor="middle">Owned by Home / Global Chrome</text></svg>