" y="724" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >Message states</text><rect x="56" y="762" width="632" height="156" rx="10" fill="#FFF1F0" stroke="#FDA29B" stroke-width="1" /><text x="78" y="800" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B42318" text-anchor="start" >Please review the highlighted fields.</text><text x="78" y="832" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Correct the information below and try again.</text><text x="78" y="854" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Your other entries are still here.</text><rect x="752" y="762" width="632" height="156" rx="10" fill="#FFFAEB" stroke="#FEDF89" stroke-width="1" /><text x="774" y="800" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B54708" text-anchor="start" >Something went wrong while submitting your request.</text><text x="774" y="832" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Your information is still here. Please try again.</text><rect x="56" y="958" width="632" height="156" rx="10" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="1" /><text x="78" y="996" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#067647" text-anchor="start" >Thank you. We’ve received your quotation request.</text><text x="78" y="1028" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Our team will review the details and contact you</text><text x="78" y="1050" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >using the information provided.</text><rect x="752" y="958" width="632" height="156" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="774" y="996" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#062B5B" text-anchor="start" >The quotation request form is temporarily unavailable.</text><text x="774" y="1028" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >No request has been submitted. Please return later</text><text x="774" y="1050" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >and try again.</text><text x="56" y="1196" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#062B5B" text-anchor="start" >Visual rules</text><rect x="56" y="1232" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1248" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1248" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >Focus uses a 2px Deep Teal border plus separation; it is not colour-only.</text><rect x="56" y="1286" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1302" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1302" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >Errors pair icon/heading/border with exact field copy; no value is cleared.</text><rect x="56" y="1340" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1356" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1356" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >Success uses a calm green surface and never looks like a quote approval.</text><rect x="56" y="1394" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1410" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1410" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >Failure uses amber restraint; red is reserved for invalid fields and summaries.</text><rect x="56" y="1448" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1464" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1464" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >Privacy Policy remains a visible underlined text link immediately before submit.</text><rect x="56" y="1502" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007F77" stroke-width="2" /><text x="66" y="1518" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#007F77" text-anchor="middle" >✓</text><text x="92" y="1518" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start" >No internal review, blocker, pending, evidence or route-status wording enters Buyer Clean.</text></svg>