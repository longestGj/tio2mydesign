 x="730" y="1490" width="620" height="138" rx="12" fill="#FFFFFF" stroke="#062B5B" stroke-width="1"/><text x="754" y="1532" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#062B5B" text-anchor="start">STORAGE BLOCKED</text><text x="754" y="1568" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Apply the session choice where possible; do not claim persistence.</text><rect x="70" y="1660" width="620" height="138" rx="12" fill="#FFFFFF" stroke="#9B2C2C" stroke-width="1"/><text x="94" y="1702" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#9B2C2C" text-anchor="start">RUNTIME ERROR</text><text x="94" y="1738" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Optional tags stay denied; page and RFQ remain usable.</text><rect x="730" y="1660" width="620" height="138" rx="12" fill="#FFFFFF" stroke="#008078" stroke-width="1"/><text x="754" y="1702" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#008078" text-anchor="start">FOCUS RETURN</text><text x="754" y="1738" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Close returns focus to the Footer Cookie Settings control.</text><rect x="70" y="1885" width="1300" height="210" rx="14" fill="#031B3A" stroke="none" stroke-width="1"/><text x="100" y="1932" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="750" fill="#14B8A6" text-anchor="start">LOCKED INTERACTION RULES</text><text x="100" y="1972" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="550" fill="#FFFFFF" text-anchor="start">• No preselection or dark patterns.</text><text x="100" y="2002" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="550" fill="#FFFFFF" text-anchor="start">• Accept analytics and Necessary only have equal prominence.</text><text x="100" y="2032" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="550" fill="#FFFFFF" text-anchor="start">• Advertising-related consent remains denied.</text><text x="100" y="2062" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="550" fill="#FFFFFF" text-anchor="start">• Only the Gate 8/9 verified release state may render.</text></svg>