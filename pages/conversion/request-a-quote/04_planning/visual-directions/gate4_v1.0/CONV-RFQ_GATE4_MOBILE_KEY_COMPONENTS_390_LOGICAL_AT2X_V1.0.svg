r="start" >B2B QUOTATION REQUEST</text><text x="36" y="337" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#062B5B" text-anchor="start" >Request a Titanium</text><text x="36" y="371" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#062B5B" text-anchor="start" >Dioxide Quote</text><text x="36" y="408" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >Tell us the product, application, quantity</text><text x="36" y="429" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >and destination you are evaluating. Our team</text><text x="36" y="450" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >will review your requirements and prepare the</text><text x="36" y="471" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >appropriate commercial response.</text><rect x="30" y="520" width="330" height="920" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#s)"/><rect x="30" y="520" width="5" height="920" rx="12" fill="#007F77" stroke="#007F77" stroke-width="0" /><text x="52" y="570" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#062B5B" text-anchor="start" >Quotation request details</text><text x="52" y="602" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >Required fields are marked. Please use</text><text x="52" y="620" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >business information and avoid confidential</text><text x="52" y="638" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >formulations, account credentials, payment</text><text x="52" y="656" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >details or sensitive personal information.</text><text x="52" y="675" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#007F77" text-anchor="start" >YOUR REQUIREMENT</text><line x1="52" y1="689" x2="338" y2="689" stroke="#D9E2EC" stroke-width="1"/><text x="52" y="724" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Product / Grade *</text><rect x="52" y="738" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="67" y="771" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#526176" text-anchor="start" >Select a product or grade</text><text x="52" y="834" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Application *</text><rect x="52" y="848" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="67" y="881" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#526176" text-anchor="start" >Select an application</text><text x="52" y="944" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Required Quantity *</text><rect x="52" y="958" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" /><text x="67" y="991" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#526176" text-anchor="start" >Enter quantity</text><rect x="178" y="958" width="160" height="52" rx="0" fill="#F5F8FB" stroke="#D9E2EC" stroke-width="1" /><text x="258" y="991" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#062B5B" text-anchor="middle" >Metric tonnes (MT)</text><text x="52" y="1054" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#062B5B" text-anchor="start" >Destination Country *</text><rect x="52" y="1068" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#007F77" stroke-width="2" filter="url(#s)"/><text x="67" y="1101" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#526176" text-anchor="start" >Enter the destination country</text><text x="52" y="1194" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >We use the information you provide to review</text><text x="52" y="1212" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >and respond to your quotation request.</text><text x="52" y="1245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#526176" text-anchor="start" >Learn more in our</text><text x="151" y="1245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#007F77" text-anchor="start" text-decoration="underline">Privacy Policy.</text><rect x="52" y="1280" width="286" height="52" rx="7" fill="#007F77" stroke="#007F77" stroke-width="1" /><text x="195" y="1313" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >REQUEST QUOTE</text><text x="20" y="1670" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#062B5B" text-anchor="start" >No decorative image; content and form stay first.</text></svg>