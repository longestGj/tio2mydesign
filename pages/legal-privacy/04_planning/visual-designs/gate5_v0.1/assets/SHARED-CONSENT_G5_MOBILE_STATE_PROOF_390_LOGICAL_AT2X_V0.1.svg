<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1780" viewBox="0 0 390 1780"><rect x="0" y="0" width="390" height="1780" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/><text x="20" y="42" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#062B5B" text-anchor="start">Cookie Settings · Mobile states</text><text x="20" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">State labels are review annotations only.</text><text x="20" y="110" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="750" fill="#64748B" text-anchor="start">CURRENT · NO OPTIONAL ANALYTICS</text><rect x="20" y="126" width="350" height="353" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/><text x="40" y="160" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="750" fill="#062B5B" text-anchor="start">Cookie settings</text><text x="40" y="202" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">No optional Analytics or advertising</text><text x="40" y="225" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">technology is currently active on this</text><text x="40" y="248" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">site. Necessary functions may use browser</text><text x="40" y="271" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">storage to operate the site and remember</text><text x="40" y="294" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">an available privacy setting.</text><rect x="40" y="335" width="310" height="48" rx="7" fill="#FFFFFF" stroke="#062B5B" stroke-widt